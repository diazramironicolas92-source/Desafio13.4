<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="azul" style="width: 200px; height: 200px; background-color: blue; "></div>
    <div id="rojo" style="width: 200px; height: 200px; background-color: red; "></div>
    <div id="verde" style="width: 200px; height: 200px; background-color: green; "></div>
    <div id="amarillo" style="width: 200px; height: 200px; background-color: yellow; "></div>
    <div id="key" style="width: 200px; height: 200px; background-color: white; "></div>
    <script>
      
        var colorSeleccionado = "white";

    const key = document.getElementById("key");

    document.querySelectorAll("#azul, #rojo, #verde, #amarillo").forEach(div => {
      div.addEventListener("click", function () {
        div.style.backgroundColor = "black";
      });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "a" || event.key === "A") {
        colorSeleccionado = "pink";
        key.style.backgroundColor = colorSeleccionado;
      } else if (event.key === "s" || event.key === "S") {
        colorSeleccionado = "orange";
        key.style.backgroundColor = colorSeleccionado;
      } else if (event.key === "d" || event.key === "D") {
        colorSeleccionado = "lightblue";
        key.style.backgroundColor = colorSeleccionado;
      } else if (event.key === "q" || event.key === "Q") {
        const nuevo = document.createElement("div");
        nuevo.style.width = "200px";
        nuevo.style.height = "200px";
        nuevo.style.backgroundColor = "purple";
        nuevo.style.border = "2px solid black";
        nuevo.style.marginTop = "20px";
        document.body.appendChild(nuevo);
      } else if (event.key === "w" || event.key === "W") {
        const nuevo = document.createElement("div");
        nuevo.style.width = "200px";
        nuevo.style.height = "200px";
        nuevo.style.backgroundColor = "gray";
        nuevo.style.border = "2px solid black";
        nuevo.style.marginTop = "20px";
        document.body.appendChild(nuevo);
      } else if (event.key === "e" || event.key === "E") {
        const nuevo = document.createElement("div");
        nuevo.style.width = "200px";
        nuevo.style.height = "200px";
        nuevo.style.backgroundColor = "brown";
        nuevo.style.border = "2px solid black";
        nuevo.style.marginTop = "20px";
        document.body.appendChild(nuevo);
      }
    });
    </script>

</body>

</html>
